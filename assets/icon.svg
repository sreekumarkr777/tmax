<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1733"/>
      <stop offset=".55" stop-color="#0C0D1A"/>
      <stop offset="1" stop-color="#05060B"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".7" r=".55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".30"/>
      <stop offset=".5" stop-color="#7C5CFF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".03"/>
    </linearGradient>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824px artwork centred on a 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- faint grid: the "control room" -->
  <g stroke="#FFFFFF" stroke-opacity=".035" stroke-width="2">
    <path d="M100 306H924M100 512H924M100 718H924M306 100V924M512 100V924M718 100V924"/>
  </g>

  <!-- prompt chevron -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 352 L418 512 L262 672" stroke="url(#ink)" stroke-width="86" filter="url(#soft)" opacity=".55"/>
    <path d="M262 352 L418 512 L262 672" stroke="url(#ink)" stroke-width="78"/>
  </g>

  <!-- token meter rising to max: the cursor -->
  <g>
    <rect x="500" y="596" width="74" height="96" rx="20" fill="#8B5CF6" opacity=".75"/>
    <rect x="602" y="500" width="74" height="192" rx="20" fill="#6F7CF8" opacity=".9"/>
    <rect x="704" y="352" width="74" height="340" rx="20" fill="#22D3EE" filter="url(#soft)" opacity=".7"/>
    <rect x="704" y="352" width="74" height="340" rx="20" fill="url(#ink)"/>
    <rect x="704" y="352" width="74" height="340" rx="20" fill="none" stroke="#E6FBFF" stroke-opacity=".45" stroke-width="3"/>
  </g>

  <!-- three agent nodes -->
  <g>
    <circle cx="300" cy="254" r="16" fill="#22D3EE"/>
    <circle cx="362" cy="254" r="16" fill="#7C8CFF" opacity=".85"/>
    <circle cx="424" cy="254" r="16" fill="#8B5CF6" opacity=".7"/>
  </g>
</svg>
